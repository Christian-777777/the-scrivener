<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="pageGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5e6c8"/>
      <stop offset="100%" stop-color="#d4b896"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b6914"/>
      <stop offset="50%" stop-color="#daa520"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
    <linearGradient id="coverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a3728"/>
      <stop offset="50%" stop-color="#3d2b1f"/>
      <stop offset="100%" stop-color="#2c1810"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#daa520" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2c1810" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景圆 -->
  <rect width="512" height="512" rx="100" fill="#2c1810"/>

  <!-- 背景柔光 -->
  <circle cx="256" cy="200" r="200" fill="url(#glowGrad)"/>

  <!-- 打开的书本 - 左页 -->
  <path d="M100 140 L256 150 L256 420 L100 400 Z" fill="url(#pageGrad)" stroke="#8b6914" stroke-width="2"/>

  <!-- 打开的书本 - 右页 -->
  <path d="M256 150 L412 140 L412 400 L256 420 Z" fill="url(#pageGrad)" stroke="#8b6914" stroke-width="2"/>
  <path d="M256 150 L256 420" stroke="#8b6914" stroke-width="3" opacity="0.5"/>

  <!-- 书脊金色装饰线 -->
  <line x1="100" y1="138" x2="412" y2="138" stroke="#8b6914" stroke-width="3"/>

  <!-- 左页文字横线 -->
  <line x1="130" y1="180" x2="230" y2="183" stroke="#8b6914" stroke-width="2" opacity="0.3"/>
  <line x1="130" y1="210" x2="240" y2="212" stroke="#8b6914" stroke-width="2" opacity="0.3"/>
  <line x1="130" y1="240" x2="220" y2="241" stroke="#8b6914" stroke-width="2" opacity="0.3"/>
  <line x1="130" y1="270" x2="235" y2="271" stroke="#8b6914" stroke-width="2" opacity="0.3"/>
  <line x1="130" y1="300" x2="210" y2="300" stroke="#8b6914" stroke-width="2" opacity="0.3"/>
  <line x1="130" y1="330" x2="228" y2="330" stroke="#8b6914" stroke-width="2" opacity="0.3"/>

  <!-- 右页文字横线 -->
  <line x1="282" y1="183" x2="382" y2="180" stroke="#8b6914" stroke-width="2" opacity="0.3"/>
  <line x1="272" y1="212" x2="382" y2="210" stroke="#8b6914" stroke-width="2" opacity="0.3"/>
  <line x1="292" y1="241" x2="382" y2="240" stroke="#8b6914" stroke-width="2" opacity="0.3"/>
  <line x1="277" y1="271" x2="382" y2="270" stroke="#8b6914" stroke-width="2" opacity="0.3"/>
  <line x1="302" y1="300" x2="382" y2="300" stroke="#8b6914" stroke-width="2" opacity="0.3"/>
  <line x1="284" y1="330" x2="382" y2="330" stroke="#8b6914" stroke-width="2" opacity="0.3"/>

  <!-- 中央菱形徽章 -->
  <g transform="translate(256, 275)">
    <!-- 菱形外框 -->
    <path d="M0 -45 L35 0 L0 45 L-35 0 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3.5"/>
    <!-- 菱形填充 -->
    <path d="M0 -35 L27 0 L0 35 L-27 0 Z" fill="#b8860b" opacity="0.15"/>
    <!-- 中心圆 -->
    <circle cx="0" cy="0" r="8" fill="#daa520"/>
    <circle cx="0" cy="0" r="4" fill="#f5e6c8"/>
  </g>

  <!-- 封面底部金色横条 -->
  <rect x="100" y="390" width="312" height="8" rx="3" fill="url(#goldGrad)" opacity="0.6"/>

  <!-- 底部文字区域 -->
  <text x="256" y="450" text-anchor="middle" fill="url(#goldGrad)" font-family="serif" font-size="24" font-weight="bold" letter-spacing="6">世界OC</text>

</svg>
